name: Blog con IA

on:
  # Lunes y jueves a las 9:00 hora de Torreón (15:00 UTC)
  schedule:
    - cron: '0 15 * * 1,4'
  # Y a mano desde la pestaña Actions
  workflow_dispatch:
    inputs:
      slug:
        description: 'Tema específico (vacío = el siguiente pendiente)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: blog
  cancel-in-progress: false

jobs:
  escribir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci --omit=dev || npm install --omit=dev

      - name: Escribir el artículo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            node scripts/blog-generate.mjs --slug=${{ inputs.slug }}
          else
            node scripts/blog-generate.mjs
          fi

      - name: Regenerar el sitio
        run: |
          node build.mjs
          cp img/*.jpg img/logo.png docs/img/ 2>/dev/null || true

      - name: Publicar
        run: |
          git config user.name  "Blog Home Express"
          git config user.email "actions@github.com"
          if git diff --quiet; then
            echo "Sin cambios: no había temas pendientes."
            exit 0
          fi
          git add -A
          git commit -m "blog: artículo nuevo ($(date +%Y-%m-%d))"
          git push
